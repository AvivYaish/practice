<main>

  <div class="card">
    <section id="home">
      <div id="home-controls">
        <button class="primary" onclick="start()">Start (Enter)<small id="questionCount"></small></button>
        <div id="database" class="control-row"><span>Database:</span><button id="link" onclick="window.showOpenFilePicker ? linkFile() : $('import').click()">Load</button><input id="import" type="file" accept=".json,application/json" aria-label="Load database" hidden><button onclick="download()">Download</button><button onclick="openEditor()">Edit</button></div>
        <div id="reset" class="control-row"><span>Reset:</span></div>
        <div id="tags" class="control-row"><div id="tagFilters"><span>Filters:</span><small>- exclude<br>+ include</small></div><div id="tagOptions" role="group" aria-label="Question filters"></div></div>
      </div>
    </section>
    <section id="quiz" hidden>
      <div class="toolbar"><span id="clock" class="counter" role="timer"></span><span id="position" class="counter"></span><button class="counter" id="wrongButton" onclick="popup('wrong')">Wrong: 0 (7)</button><div id="navigation"><button id="back" onclick="index ? show(-1) : home()">Back (←)</button><button id="next" class="primary" onclick="advance()">Next (→)</button></div><div class="quiz-actions"><button id="note" onclick="popup('note')">Note (8)</button><button id="reveal" onclick="reveal()">Reveal (9)</button><button id="end" onclick="finish('Ended early.')">End (0)</button></div></div>
      <progress id="progress" value="0" aria-label="Questions answered"></progress>
      <h2 id="prompt" tabindex="-1"></h2>
      <div id="choices"></div>
      <hr><div id="tag"></div>
      <div id="feedback" aria-live="polite" hidden></div>
    </section>
    <section id="results" hidden>
      <h1 id="resultTitle"></h1><p id="score"></p>
      <div class="actions"><button class="primary" onclick="start()">Start (Enter)</button><button onclick="home()">Home</button></div>
      <h2 id="missesTitle"></h2><div id="misses"></div>
      <h2 id="unviewedTitle"></h2><div id="unviewed"></div>
    </section>
  </div>
</main>
<div id="dropHint" role="status">Drop JSON to load</div>

  </form></details>

    <label>Note<textarea id="editNote" rows="3"></textarea></label>
    <button class="primary">Save question</button>
  </form>
</dialog>
